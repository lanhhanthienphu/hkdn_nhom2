<div class="field{% if field.errors %} field-invalid{% endif %}">
    <label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>
    <div class="auth-input-wrap{% if field.field.widget.input_type == 'password' %} password-wrap{% endif %}">
        {{ field }}
        {% if field.field.widget.input_type == 'password' %}<button type="button" class="password-toggle" data-password-toggle="{{ field.id_for_label }}" aria-controls="{{ field.id_for_label }}" aria-label="Hiện {{ field.label|lower }}" aria-pressed="false" hidden>Hiện</button>{% endif %}
    </div>
    {% if field.help_text %}<div class="form-text auth-help" id="{{ field.auto_id }}_helptext">{{ field.help_text|safe }}</div>{% endif %}
    {{ field.errors }}
</div>
