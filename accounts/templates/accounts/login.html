<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Đăng nhập - Helpdesk System</title>
</head>
<body>
    <div style="width: 400px; margin: 50px auto; padding: 20px; border: 1px solid #ccc; border-radius: 5px;">
        <h2>Đăng nhập hệ thống</h2>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Đăng nhập</button>
        </form>
        <p>Chưa có tài khoản? <a href="{% url 'accounts:register' %}">Đăng ký ngay</a></p>
    </div>
</body>
</html>
