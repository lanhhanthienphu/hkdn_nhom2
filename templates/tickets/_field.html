<div class="field{% if field.errors %} field-invalid{% endif %}">
    <label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %} <span class="required-mark" aria-hidden="true">*</span>{% else %} <span class="optional-label">(không bắt buộc)</span>{% endif %}</label>
    {{ field }}
    {% if field.help_text %}<div class="form-text" id="{{ field.auto_id }}_helptext">{{ field.help_text }}</div>{% endif %}
    {{ field.errors }}
</div>
